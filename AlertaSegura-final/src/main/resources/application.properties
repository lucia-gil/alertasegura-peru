# Configuracion base. Los valores reales van en application-dev.properties
# (NO se sube al repo - esta en .gitignore).

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/alertasegura}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:cambia_esto_en_produccion_por_un_valor_largo_y_aleatorio}
jwt.expiration=${JWT_EXPIRATION:86400000}
